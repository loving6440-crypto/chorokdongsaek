# Fly.io 배포 설정.
# app 이름은 전역에서 유일해야 하므로, `fly launch` 를 처음 돌릴 때 실제 쓸 이름으로 바꿔야 한다
# (예: chorokdongsaek 이 이미 쓰이고 있으면 chorokdongsaek-xyz 처럼).
app = "chorokdongsaek"
primary_region = "nrt" # 도쿄 — 한국에서 제일 가까운 리전 중 하나. 다른 곳을 원하면 `fly platform regions` 로 목록 확인.

[build]

# 공개돼도 괜찮은 값만 여기 둔다. DATABASE_URL · CHOROK_ADMIN_KEY 같은 비밀값은
# `fly secrets set DATABASE_URL=...` 처럼 secrets 로 넣는다 (fly.toml 에 적지 않는다).
[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false   # 채팅(SSE)이 계속 연결돼 있어야 하므로 슬립시키지 않는다.
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
