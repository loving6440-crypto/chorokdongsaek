# Render 블루프린트(무료 플랜). GitHub 저장소 루트에 두고 Render 에서 'New > Blueprint' 로 연결한다.
services:
  - type: web
    name: chorokdongsaek
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      # 관리자 키: Render 대시보드 > Environment 에서 직접 값을 넣는다. (저장소에 올리지 않는다)
      - key: CHOROK_ADMIN_KEY
        sync: false
      # Supabase 연결 주소(Session pooler). 랭킹 · 벼룩시장 · 인적사항 카드 · 회원 명부가 여기 저장된다.
      # 없으면 서버 파일(data.json)에 저장되어 Render 재시작 · 재배포 때마다 초기화된다.
      - key: DATABASE_URL
        sync: false
      # B.12: 검증 경제 기능은 운영 기본값을 꺼 둔다. Render에 이미 설정한 값은 직접 관리.
      - key: CHOROK_ENABLE_VERIFIED_ECONOMY
        value: '0'
      # B.15: Supabase 대시보드(Database > SSL Configuration)에서 받은 CA 인증서(PEM 본문).
      # 넣으면 DB 서버 인증서를 검증한다. 비워 두면 예전처럼 검증 없이 연결하고 부팅 로그에 경고만 남긴다.
      - key: CHOROK_DB_CA_CERT
        sync: false
