<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 첫 페인트 전에 저장된 테마를 적용해 화면 깜빡임을 막는다. (저장값이 없으면 다크) -->
    <script>
      try {
        var t = localStorage.getItem('changnok-theme')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
        var font = localStorage.getItem('changnok-ui-font')
        document.documentElement.dataset.uiFont = ['neo', 'stardust', 'galmuri9', 'silver', 'ramche'].includes(font) ? font : 'neo'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
        document.documentElement.dataset.uiFont = 'neo'
      }
    </script>
    <title>草綠同色</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
