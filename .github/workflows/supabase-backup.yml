name: Supabase DB 자동 백업
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: postgresql-client 설치 (pg_dump)
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client
      - name: DB 덤프 뜨기
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup
          ts=$(date -u +%Y%m%d_%H%M%S)
          pg_dump "$DATABASE_URL" --no-owner --no-privileges --format=plain \
            | gzip > "backup/chorokdongsaek_${ts}.sql.gz"
          ls -la backup
      - name: 백업 파일 업로드 (30일 보관)
        uses: actions/upload-artifact@v4
        with:
          name: chorokdongsaek-db-backup
          path: backup/*.sql.gz
          retention-days: 30
